name: Validate

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

# least privilege: these jobs only read the repository
permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main
        with:
          category: "integration"
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false
        - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c  # master