# SPDX-License-Identifier: Apache-2.0
#
# Report-only dependency scan with the VulnCheck CLI.
#
# The official vulncheck-oss/action downloads the latest CLI release at run time
# without a fixed version or checksum, so pinning the action would not pin the
# code that runs. This workflow installs a fixed CLI release and verifies its
# SHA-256 before running it. To update: change VULNCHECK_VERSION and
# VULNCHECK_SHA256 (the linux_amd64 line of vulncheck_<version>_checksums.txt
# in https://github.com/vulncheck-oss/cli/releases).
#
# The scan needs the repository secret VC_TOKEN (a VulnCheck API token). Without
# it, e.g. on pull requests from forks, the job is skipped with a notice. It is
# not a required check and it is not part of the release gate.
name: "VulnCheck"

on:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: "VulnCheck scan (report only)"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    env:
      VULNCHECK_VERSION: "1.3.0"
      VULNCHECK_SHA256: "abbc3ae77cf07418ab95be7da1ebcdd2290d42e322ece0cc36f295ca649bbe3d"
    steps:
      - name: "Check for the VulnCheck token"
        id: token
        env:
          VC_TOKEN: ${{ secrets.VC_TOKEN }}
        run: |
          if [ -n "${VC_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::VC_TOKEN is not available: VulnCheck scan skipped."
          fi

      - name: "Checkout the repository"
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install the VulnCheck CLI (pinned, checksum verified)"
        if: steps.token.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          name="vulncheck_${VULNCHECK_VERSION}_linux_amd64"
          dir="${RUNNER_TEMP}/vulncheck"
          mkdir -p "${dir}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${dir}/${name}.tar.gz" \
            "https://github.com/vulncheck-oss/cli/releases/download/v${VULNCHECK_VERSION}/${name}.tar.gz"
          echo "${VULNCHECK_SHA256}  ${dir}/${name}.tar.gz" | sha256sum --check --strict
          tar -xzf "${dir}/${name}.tar.gz" -C "${dir}"
          bin="$(find "${dir}" -type f -name vulncheck -perm -u+x | head -n 1)"
          test -n "${bin}"
          ln -s "${bin}" "${dir}/vc"
          echo "${dir}" >> "${GITHUB_PATH}"

      - name: "Scan the dependencies"
        if: steps.token.outputs.enabled == 'true'
        env:
          VC_TOKEN: ${{ secrets.VC_TOKEN }}
        run: |
          set -euo pipefail
          vc scan . --disable-ui --file --file-name "${RUNNER_TEMP}/vulncheck.json"
          {
            echo "### VulnCheck ${VULNCHECK_VERSION}"
            echo
            echo "Report only. Findings are listed in the log of the scan step."
          } >> "${GITHUB_STEP_SUMMARY}"
