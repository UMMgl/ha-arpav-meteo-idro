# SPDX-License-Identifier: Apache-2.0
name: "Security"

on:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: "Secrets (gitleaks)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the full history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "Scan every commit for credentials"
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  python:
    name: "Code and dependencies (bandit, pip-audit)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: "Install the scanners"
        run: python3 -m pip install bandit pip-audit

      - name: "Static analysis of the integration (bandit)"
        run: python3 -m bandit -r custom_components examples -ll

      - name: "Known vulnerabilities of the runtime requirements (pip-audit)"
        run: |
          python3 - <<'PY' > requirements_runtime.txt
          import json
          print("\n".join(json.load(open("custom_components/arpav_meteo_idro/manifest.json"))["requirements"]))
          PY
          python3 -m pip_audit -r requirements_runtime.txt --progress-spinner off

  workflows:
    name: "Workflows (zizmor)"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: "Static analysis of the GitHub Actions workflows"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install zizmor
          zizmor --format=github --min-severity=low .github/workflows

  codeql:
    name: "CodeQL"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "actions"]
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: "Analyze"
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          category: "/language:${{ matrix.language }}"
