# SPDX-License-Identifier: Apache-2.0
name: "Tests"

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: "Install requirements"
        run: python3 -m pip install -r requirements_test.txt

      - name: "Run"
        run: python3 -m pytest -q tests --cov=custom_components.arpav_meteo_idro --cov-report=term-missing:skip-covered

      - name: "Quality scale: Bronze required, higher tiers reported"
        run: python3 scripts/check_quality_scale.py bronze
