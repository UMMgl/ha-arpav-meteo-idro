name: "Release"

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      # build provenance attestation of the release ZIP (OIDC)
      id-token: write
      attestations: write
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@7ce6be4c4d2233ae2a943694ca34f23aeafa1054  # v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}

      - name: "Adjust version number"
        shell: "bash"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          yq -i -o json '.version = strenv(RELEASE_VERSION)' \
            "${{ github.workspace }}/custom_components/arpav_meteo_idro/manifest.json"

      - name: "Build and verify the HACS ZIP"
        shell: "bash"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          archive="$RUNNER_TEMP/ha-arpav-meteo-idro.zip"
          (cd custom_components/arpav_meteo_idro && zip -r "$archive" ./)
          zip -j "$archive" LICENSE LICENSE-BSD-3-Clause NOTICE
          python3 - "$archive" <<'PY'
          import json
          import os
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as archive:
              expected = {"LICENSE", "LICENSE-BSD-3-Clause", "NOTICE", "manifest.json", "__init__.py"}
              missing = expected - set(archive.namelist())
              if missing:
                  raise SystemExit(f"Missing HACS ZIP files: {sorted(missing)}")
              version = json.loads(archive.read("manifest.json"))["version"]
              if version != os.environ["RELEASE_VERSION"]:
                  raise SystemExit(f"Incorrect HACS manifest version: {version}")
          PY

      - name: "SBOM of the runtime requirements (OWASP CycloneDX)"
        shell: "bash"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # the SBOM describes this release: version from the tag
          sed -i "s/^version = .*/version = \"$RELEASE_VERSION\"/" pyproject.toml
          python3 -m venv "$RUNNER_TEMP/runtime"
          python3 - > "$RUNNER_TEMP/requirements_runtime.txt" <<'PY'
          import json
          print("\n".join(json.load(open("custom_components/arpav_meteo_idro/manifest.json"))["requirements"]))
          PY
          "$RUNNER_TEMP/runtime/bin/pip" install --quiet -r "$RUNNER_TEMP/requirements_runtime.txt"
          python3 -m pip install --quiet --require-hashes -r requirements_release.txt
          python3 -m cyclonedx_py environment "$RUNNER_TEMP/runtime/bin/python" \
            --pyproject pyproject.toml --of JSON -o "$RUNNER_TEMP/ha-arpav-meteo-idro.cdx.json"

      - name: "SHA-256 checksums"
        shell: "bash"
        run: |
          cd "$RUNNER_TEMP"
          sha256sum ha-arpav-meteo-idro.zip ha-arpav-meteo-idro.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: "Build provenance attestation of the ZIP"
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ha-arpav-meteo-idro.zip

      - name: "Name the attestation bundle for the release"
        shell: "bash"
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/ha-arpav-meteo-idro.intoto.jsonl"

      - name: "Upload the release assets"
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          body: ${{ steps.changelog.outputs.changes }}
          # beta and release candidate tags (e.g. 0.15.5b1, 0.15.5rc1) are GitHub
          # pre-releases: HACS offers them only to users who enable beta versions
          prerelease: ${{ contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: |
            ${{ runner.temp }}/ha-arpav-meteo-idro.zip
            ${{ runner.temp }}/ha-arpav-meteo-idro.cdx.json
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/ha-arpav-meteo-idro.intoto.jsonl

      # main is protected (changes only through pull requests): the changelog of each
      # version is published in the release notes, not committed back to main
