refresh_data:
  name: "Refresh Weather Data"
  description: "Manually refresh weather data from the API"
  fields:
    entry_id:
      name: "Station"
      description: "The configured station to refresh. Refreshes all of them when omitted."
      required: false
      selector:
        config_entry:
          integration: arpav_meteo_idro

archive_brightness:
  name: "Archive night sky brightness"
  description: "Import the night sky brightness readings the ARPAV API exposes (about the last 72 hours) as long-term statistics"
  fields:
    entry_id:
      name: "Station"
      description: "The configured station whose nearby brightness stations to archive. Archives for all of them when omitted."
      required: false
      selector:
        config_entry:
          integration: arpav_meteo_idro

archive_hydro_history:
  name: "Complete the hydrometric history"
  description: "Rebuild the hourly statistics of the water level sensors from the readings ARPAV still publishes (about the last 2-3 days), filling the hours that were missed"
  fields:
    entry_id:
      name: "River"
      description: "The configured hydrometric stations to archive. Archives all of them when omitted."
      required: false
      selector:
        config_entry:
          integration: arpav_meteo_idro
