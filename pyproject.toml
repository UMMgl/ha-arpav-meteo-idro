[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-arpav-meteo-idro"
version = "0.1.0"
description = "Home Assistant integration for ARPAV (Veneto) weather and hydrometric stations"
readme = "README.md"
license = {text = "Apache-2.0 AND BSD-3-Clause"}
requires-python = ">=3.11"
dependencies = [
    "pytz==2026.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
[tool.arpav_meteo_idro]
# Minimum Home Assistant quality tier that the Release workflow requires for a
# stable tag (bronze, silver, gold or platinum). It is a ratchet: it may only
# rise, never fall below the highest tier in [tool.arpav_meteo_idro.released]
# (checked by scripts/check_quality_scale.py --ratchet). See docs/quality_scale.md.
release_tier = "silver"

[tool.arpav_meteo_idro.released]
# Tier of each stable release already published. Add the entry for a version in
# the first pull request after its tag; that is what the ratchet compares against,
# so the check needs no network access.
"0.15.5" = "bronze"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# tests/test_hydro.py loads hydro.py by file path under another module name:
# measuring by path keeps those runs counted for the package file
relative_files = true

[tool.coverage.report]
# the Tests workflow runs pytest with --cov: pytest-cov enforces this threshold
# (first step of the coverage plan, issue #5; next steps 85 %, then 95 %)
fail_under = 70
skip_empty = true
