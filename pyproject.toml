[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-arpav-meteo-idro"
version = "0.1.0"
description = "Home Assistant integration for ARPAV (Veneto) weather and hydrometric stations"
readme = "README.md"
license = {text = "Apache-2.0 AND BSD-3-Clause"}
requires-python = ">=3.11"
dependencies = [
    "pytz==2026.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
