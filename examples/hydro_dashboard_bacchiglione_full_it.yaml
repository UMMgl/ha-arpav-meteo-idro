sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Livelli ARPAV (monte → valle)
  - type: markdown
    content: '{%- set dot = {''below_g1'':''#2e7d32'',''g1_g2'':''#fbc02d'',''g2_g3'':''#ef6c00'',''above_g3'':''#c62828''} -%}

      {%- set arrow = {''rising'':''mdi:arrow-top-right-thick'',''steady'':''mdi:arrow-right-thick'',''falling'':''mdi:arrow-bottom-right-thick''} -%}

      | Stazione | Livello | Stato | Età (min) | Trend |

      |---|---:|:---:|---:|:---:|

      {% for s in states.sensor | selectattr(''attributes.source'', ''defined'') | selectattr(''attributes.source'', ''eq'', ''arpav_hydrometric_station'') | selectattr(''attributes.display_order'', ''defined'')
      | selectattr(''attributes.station_id'', ''in'', ["276", "333", "303", "308", "334", "595", "287"]) | sort(attribute=''attributes.display_order'') -%}

      {%- set d = s.attributes.level_change_m -%}

      | <small>{{ (s.attributes.station_name or s.name).split('' a '')[-1] }}</small> | <small>{{ ''%.2f'' | format(s.attributes.level_m) if s.attributes.level_m is number else ''—'' }}</small> | <font
      size="4" color="{{ dot.get(s.state, ''#9e9e9e'') }}">{{ ''◯'' if s.state in [''stale'', ''missing''] else ''⬤'' }}</font> | {{ s.attributes.age_minutes | round(0) | int if s.attributes.age_minutes
      is number else ''—'' }} | {% if s.attributes.trend %}<ha-icon icon="{{ arrow[s.attributes.trend] }}"></ha-icon>{% if s.attributes.trend != ''steady'' and d is number %} <small>{{ ''%+.0f'' | format(d
      * 100) }}</small>{% endif %}{% else %}—{% endif %} |

      {% endfor %}'
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Legenda
    heading_style: subtitle
  - type: markdown
    content: '<small>**Grafici**: area blu sotto G1, gialla oltre G1, arancione oltre G2, rossa oltre G3; scala normalizzata con G1 al 60% e G3 al 90% dell''altezza (si allarga se il livello esce); i buchi
      sono misure mancanti.<br>**Stato**: <font color="#2e7d32">⬤</font> sotto G1 · <font color="#fbc02d">⬤</font> G1–G2 · <font color="#ef6c00">⬤</font> G2–G3 · <font color="#c62828">⬤</font> da G3 · <font
      color="#9e9e9e">⬤</font> soglie non pubblicate · <font color="#9e9e9e">◯</font> dato mancante o vecchio.<br>**Trend**: ultime 4 misure; freccia inclinata e variazione in cm da ±5 cm.<br>Livelli rispetto
      allo zero idrometrico locale: non confrontabili tra stazioni. Stazioni monitorate mostrate da monte a valle (ordine candidato).<br>_Fonte: ARPAV, dati automatici non validati, CC BY 4.0. Non è un
      servizio di allerta._</small>'
