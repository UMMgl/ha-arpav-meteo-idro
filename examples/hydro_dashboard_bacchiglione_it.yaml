# Generated by examples/generate_hydro_dashboard.py --lang it
title: Bacchiglione
path: bacchiglione
type: sections
max_columns: 4
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Livelli ARPAV (monte → valle)
  - type: markdown
    content: '{%- set dot = {''below_g1'':''#2e7d32'',''g1_g2'':''#fbc02d'',''g2_g3'':''#ef6c00'',''above_g3'':''#c62828''} -%}

      {%- set arrow = {''rising'':''mdi:arrow-top-right-thick'',''steady'':''mdi:arrow-right-thick'',''falling'':''mdi:arrow-bottom-right-thick''} -%}

      | Stazione | Livello | Stato | Trend |

      |---|---:|:---:|:---:|

      {% for s in states.sensor | selectattr(''attributes.source'', ''defined'') | selectattr(''attributes.source'', ''eq'', ''arpav_hydrometric_station'') | selectattr(''attributes.display_order'', ''defined'')
      | sort(attribute=''attributes.display_order'') -%}

      {%- set d = s.attributes.level_change_m -%}

      | <small>{{ (s.attributes.station_name or s.name).split('' a '')[-1] }}</small> | <small>{{ ''%.2f'' | format(s.attributes.level_m) if s.attributes.level_m is number else ''—'' }}</small> | <font
      size="4" color="{{ dot.get(s.state, ''#9e9e9e'') }}">{{ ''◯'' if s.state in [''stale'', ''missing''] else ''⬤'' }}</font> | {% if s.attributes.trend %}<ha-icon icon="{{ arrow[s.attributes.trend] }}"></ha-icon>{%
      if s.attributes.trend != ''steady'' and d is number %} <small>{{ ''%+.0f'' | format(d * 100) }}</small>{% endif %}{% else %}—{% endif %} |

      {% endfor %}'
  - type: markdown
    content: '<small>Fonte: ARPAV, dati automatici non validati, CC BY 4.0. Non è un servizio di allerta.</small>'
- type: grid
  column_span: 4
  cards:
  - type: heading
    heading: Ultime 24 ore, dalla sorgente alla foce
  - type: horizontal-stack
    grid_options:
      columns: full
    visibility:
    - condition: screen
      media_query: '(min-width: 768px)'
    cards:
    - type: custom:apexcharts-card
      graph_span: 24h
      update_interval: 5min
      header:
        show: true
        title: Ponte Marchese
        show_states: true
      series:
      - entity: sensor.bacchiglione_a_ponte_marchese_livello_idrometrico
        name: Livello
        type: area
        color: '#1e88e5'
        opacity: 0.35
        stroke_width: 2
        curve: stepline
        fill_raw: last
        group_by: &id001
          func: last
          duration: 10min
          fill: last
      - entity: sensor.bacchiglione_a_ponte_marchese_livello_idrometrico
        name: '>= 1.0'
