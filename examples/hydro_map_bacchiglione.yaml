# Map of the Bacchiglione ARPAV hydrometric stations (issue #20).
# Copy-ready view: it only reads the `latitude` / `longitude` attributes that
# the Status sensor already exposes; no integration code is involved.
# Entity IDs: English, sensor.bacchiglione_a_<station>_status. Adjust the list if your stations differ.
# Built-in cards only (Map, Markdown).
title: Bacchiglione map
path: bacchiglione-map
type: sections
max_columns: 2
sections:
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: ARPAV hydrometric stations on the map
  - type: map
    title: ARPAV
    default_zoom: 10
    auto_fit: true
    hours_to_show: 0
    theme_mode: auto
    entities:
    - entity: sensor.bacchiglione_a_ponte_marchese_status
      label_mode: state
    - entity: sensor.bacchiglione_a_vicenza_status
      label_mode: state
    - entity: sensor.bacchiglione_a_longare_status
      label_mode: state
    - entity: sensor.bacchiglione_a_montegalda_status
      label_mode: state
    - entity: sensor.bacchiglione_a_padova_voltabarozzo_status
      label_mode: state
    - entity: sensor.bacchiglione_a_ponte_san_nicolo_status
      label_mode: state
    - entity: sensor.bacchiglione_a_bovolenta_status
      label_mode: state
  - type: markdown
    content: '{%- set dot = {''below_g1'':''#2e7d32'',''g1_g2'':''#fbc02d'',''g2_g3'':''#ef6c00'',''above_g3'':''#c62828''} -%}

      | Station | Level (m) | Status | Observed | Quality |

      |---|---:|:---|---|---|

      {% for s in states.sensor | selectattr(''attributes.source'', ''defined'') | selectattr(''attributes.source'', ''eq'', ''arpav_hydrometric_station'') | selectattr(''attributes.latitude'', ''defined'')
      | selectattr(''attributes.station_id'', ''in'', ["276", "333", "303", "308", "334", "595", "287"]) | sort(attribute=''attributes.display_order'') -%}

      {%- if s.attributes.latitude is number and s.attributes.longitude is number -%}

      | <small>{{ s.attributes.station_name or s.name }}</small> | <small>{{ ''%.2f'' | format(s.attributes.level_m) if s.attributes.level_m is number else ''—'' }}</small>
      | <font color="{{ dot.get(s.state, ''#9e9e9e'') }}">{{ ''◯'' if s.state in [''stale'', ''missing''] else ''⬤'' }}</font> <small>{{ state_translated(s.entity_id) }}</small>
      | <small>{{ as_local(as_datetime(s.attributes.source_observed_at)).strftime(''%d/%m %H:%M'') if s.attributes.source_observed_at else ''—'' }}</small>
      | <small>{{ s.attributes.quality or ''—'' }}</small> |

      {%- endif %}

      {% endfor %}'
  - type: markdown
    content: '<small>Source: ARPAV, automatic non-validated data, CC BY 4.0. Not an alert service. Stations without coordinates are left out of the map and the table.</small>'
